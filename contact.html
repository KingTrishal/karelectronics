<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <style>

        /* ─────────────────────────────────────
           RESET & BASE
        ───────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Open Sans', sans-serif;
            color: #2f2e2e;
            background: #fff;
            font-size: 16px;
            overflow-x: hidden;
        }

        /* ─────────────────────────────────────
           COLOUR VARIABLES
        ───────────────────────────────────── */
        :root {
            --crimson:    #c23b6a;
            --crimson-dk: #a8305a;
            --navy:       #1a1a3e;
            --light-bg:   #e8ebf5;
            --text-dark:  #2f2e2e;
            --text-mid:   #4a4a4a;
            --white:      #ffffff;
            --border:     #e0e0e0;
            --send-blue:  #4a6fd4;
            --send-blue-dk: #3a5bbf;
        }

        /* ─────────────────────────────────────
           TOP ACCENT BAR
        ───────────────────────────────────── */
        .top-bar {
            height: 5px;
            background: linear-gradient(90deg, var(--crimson) 0%, #8b1a4a 100%);
        }

        /* ─────────────────────────────────────
           NAVIGATION
        ───────────────────────────────────── */
        nav {
            position: sticky;
            top: 0;
            z-index: 999;
            background: #fff;
            border-bottom: 1px solid var(--border);
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-dark);
        }

        .nav-logo-icon {
            width: 34px;
            height: 34px;
            background: black;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* white diagonal slash in logo box */
        .nav-logo-icon::after {
            content: '';
            display: block;
            width: 3px;
            height: 20px;
            background: #fff;
            transform: rotate(20deg);
            border-radius: 2px;
        }

        .nav-logo-text {
            font-family: 'Raleway', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--text-dark);
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-icon-link {
            color: var(--navy);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-icon-link:hover { color: var(--crimson); }

        /* phone icon is active on this page */
        .nav-icon-link.active { color: var(--crimson); }

        /* ─────────────────────────────────────
           CONTACT HERO BANNER
           Purple/mauve background with an AC
           unit photo and "CONTACT" text overlay
        ───────────────────────────────────── */
        .contact-banner {
            position: relative;
            width: 100%;
            height: 260px;
            overflow: hidden;
            /* mauve/purple background matching the screenshot */
            background: #b09ab5;
        }

        .contact-banner img {
            position: absolute;
            /* centre the AC unit image */
            right: 0%;
            top: 50%;
            transform: translateY(-50%);
            height: auto;
            width: 100%;
            object-fit: contain;
            display: block;
        }

        .contact-banner-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            padding-left: 10%;
        }

        .contact-banner-text h1 {
            font-family: 'Raleway', sans-serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 300;
            letter-spacing: 0.25em;
            color: #fff;
            text-transform: uppercase;
        }

        /* ─────────────────────────────────────
           CONTACT BODY
           Left: form   Right: location + phone
        ───────────────────────────────────── */
        .contact-body {
            padding: 70px 10% 80px;
            background: #fff;
        }

        .contact-body h2 {
            font-family: 'Raleway', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 28px;
        }

        /* Two-column layout: form left, info right */
        .contact-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
        }

        /* ── FORM ── */
        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        .form-group label {
            font-size: 0.82rem;
            color: var(--text-dark);
            margin-bottom: 6px;
            font-weight: 400;
        }

        /* required asterisk in red */
        .form-group label .req {
            color: var(--crimson);
            margin-left: 2px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #bbb;
            border-radius: 0;
            font-family: 'Open Sans', sans-serif;
            font-size: 0.9rem;
            color: var(--text-dark);
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
            /* no default browser styling */
            -webkit-appearance: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--navy);
        }

        .form-group textarea {
            height: 130px;
            resize: vertical;
        }

        /* Send button — blue, right-aligned */
        .btn-send {
            align-self: flex-end;
            padding: 12px 48px;
            background: var(--send-blue);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            margin-top: 6px;
        }

        .btn-send:hover {
            background: var(--send-blue-dk);
            transform: translateY(-1px);
        }

        /* ── CONTACT INFO COLUMNS ── */
        .contact-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding-top: 42px; /* align with first input roughly */
        }

        .info-block h3 {
            font-family: 'Raleway', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 14px;
        }

        .info-block p {
            font-size: 0.88rem;
            color: var(--text-mid);
            line-height: 1.8;
        }

        /* ─────────────────────────────────────
           FOOTER
        ───────────────────────────────────── */
        footer {
            background: #d4d4d4;
            padding: 28px 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .footer-copy   { font-size: 0.82rem; color: var(--text-dark); }
        .footer-credit { font-size: 0.82rem; color: var(--text-dark); text-decoration: none; }

        .footer-social {
            display: flex;
            gap: 20px;
        }

        .footer-social a {
            color: var(--text-dark);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-social a:hover { color: var(--crimson); }

        /* ─────────────────────────────────────
           RESPONSIVE
        ───────────────────────────────────── */
        @media (max-width: 820px) {
            nav              { padding: 0 24px; }
            .contact-body    { padding: 50px 6% 60px; }
            .contact-layout  { grid-template-columns: 1fr; gap: 40px; }
            .contact-info    { padding-top: 0; }
            footer           { padding: 24px; flex-direction: column; text-align: center; }
            .footer-social   { justify-content: center; }
        }

        @media (max-width: 500px) {
            .contact-banner  { height: 200px; }
            .contact-info    { grid-template-columns: 1fr; }
        }

    </style>
</head>
<body>

    <!-- TOP ACCENT BAR -->

    <!-- ── CONTACT HERO BANNER ── -->
    <!-- Purple/mauve background, AC unit image, "CONTACT" text left -->
    <div class="contact-banner">
        <img
            src="assets/airConditioner.jpeg"
            alt="Air conditioning unit"

        <div class="contact-banner-text">
            <h1>Contact</h1>
        </div>
    </div>

    <!-- ── CONTACT BODY ── -->
    <section class="contact-body">

        <h2>Kar-Electronics</h2>

        <div class="contact-layout">

            <!-- LEFT: contact form -->
            <div>
                <form class="contact-form" onsubmit="handleSubmit(event)">

                    <div class="form-group">
                        <label>First Name <span class="req">*</span></label>
                        <input type="text" name="first_name" required>
                    </div>

                    <div class="form-group">
                        <label>Last Name <span class="req">*</span></label>
                        <input type="text" name="last_name" required>
                    </div>

                    <div class="form-group">
                        <label>Email <span class="req">*</span></label>
                        <input type="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" name="subject">
                    </div>

                    <div class="form-group">
                        <label>Message</label>
                        <textarea name="message"></textarea>
                    </div>

                    <button type="submit" class="btn-send">Send</button>

                </form>
            </div>

            <!-- RIGHT: location + phone -->
            <div class="contact-info">

                <div class="info-block">
                    <h3>Our Location</h3>
                    <p>
                        M9PC+Q3, Thiknikata, West<br>
                        Bengal, 734012<br>
                        contact@karelectronics.site
                    </p>
                </div>

                <div class="info-block">
                    <h3>Reach Out to Us</h3>
                    <p>Phone: 8918844784</p>
                </div>

            </div>

        </div>
    </section>

        }
