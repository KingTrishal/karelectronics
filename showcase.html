<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <style>

        /* ─────────────────────────────────────
           RESET & BASE
        ───────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Open Sans', sans-serif;
            color: #2f2e2e;
            background: #fff;
            font-size: 16px;
            overflow-x: hidden;
        }

        /* ─────────────────────────────────────
           COLOUR VARIABLES
        ───────────────────────────────────── */
        :root {
            --crimson:    #c23b6a;
            --crimson-dk: #a8305a;
            --navy:       #1a1a3e;
            --light-bg:   #e8ebf5;
            --text-dark:  #2f2e2e;
            --text-mid:   #4a4a4a;
            --white:      #ffffff;
            --border:     #e0e0e0;
            --grey-bg:    #e8e8e8;
        }

        /* ─────────────────────────────────────
           TOP ACCENT BAR
        ───────────────────────────────────── */
        .top-bar {
            height: 5px;
            background: linear-gradient(90deg, var(--crimson) 0%, #8b1a4a 100%);
        }

        /* ─────────────────────────────────────
           NAVIGATION
        ───────────────────────────────────── */
        nav {
            position: sticky;
            top: 0;
            z-index: 999;
            background: #fff;
            border-bottom: 1px solid var(--border);
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-dark);
        }

        .nav-logo-icon {
            width: 34px;
            height: 34px;
            background: black;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-logo-icon::after {
            content: '';
            display: block;
            width: 3px;
            height: 20px;
            background: #fff;
            transform: rotate(20deg);
            border-radius: 2px;
        }

        .nav-logo-text {
            font-family: 'Raleway', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--text-dark);
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-icon-link {
            color: var(--navy);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-icon-link:hover { color: var(--crimson); }

        /* ─────────────────────────────────────
           SHOWCASE HERO BANNER
           Full-width AC fan/motor close-up photo
           with "SHOWCASE" title and subtitle
           centred over it
        ───────────────────────────────────── */
        .showcase-banner {
            position: relative;
            width: 100%;
            height: 260px;
            overflow: hidden;
        }

        .showcase-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            filter: brightness(0.55);
        }

        .showcase-banner-text {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .showcase-banner-text h1 {
            font-family: 'Raleway', sans-serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 300;
            letter-spacing: 0.25em;
            color: #fff;
            text-transform: uppercase;
        }

        .showcase-banner-text p {
            font-family: 'Raleway', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.08em;
        }

        /* ─────────────────────────────────────
           SLIDESHOW SECTION
           Light grey background, centred image
           with prev/next arrows on either side
        ───────────────────────────────────── */
        .slideshow-section {
            background: var(--grey-bg);
            padding: 50px 0 0;
            position: relative;
        }

        /* Outer wrapper that positions the arrows
           and the centred image together */
        .slideshow-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 80px;
            min-height: 500px;
        }

        /* Arrow buttons — sit on the far left/right */
        .slide-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #aaa;
            font-size: 2.5rem;
            padding: 10px 20px;
            transition: color 0.2s;
            z-index: 10;
            user-select: none;
            line-height: 1;
        }

        .slide-arrow:hover { color: #555; }
        .slide-arrow.prev  { left: 0; }
        .slide-arrow.next  { right: 0; }

        /* The visible slide image — centred, fixed width */
        .slide {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .slide.active { display: flex; }

        .slide img {
            width: 820px;
            max-width: 100%;
            height: 520px;
            object-fit: cover;
            display: block;
        }

        /* Dot indicators below the image */
        .slide-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 24px 0 40px;
            background: var(--grey-bg);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #bbb;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
        }

        .dot.active { background: #777; }

        /* ─────────────────────────────────────
           STRIPED WAVE DIVIDER
           (same layered style as clients page)
        ───────────────────────────────────── */
        .wave-stripe {
            width: 100%;
            overflow: hidden;
            line-height: 0;
            background: var(--grey-bg);
        }

        .wave-stripe svg {
            display: block;
            width: 100%;
            height: 130px;
        }

        /* ─────────────────────────────────────
           CONTACT SECTION
        ───────────────────────────────────── */
        .contact {
            background: var(--light-bg);
            padding: 80px 60px 100px;
        }

        .contact-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            flex-wrap: wrap;
        }

        .contact-text h2 {
            font-family: 'Raleway', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .contact-text p {
            font-size: 0.9rem;
            color: var(--text-mid);
            line-height: 1.7;
            max-width: 560px;
        }

        /* ─────────────────────────────────────
           BUTTON
        ───────────────────────────────────── */
        .btn {
            display: inline-block;
            padding: 13px 36px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background 0.2s, transform 0.15s;
        }

        .btn-crimson {
            background: var(--crimson);
            color: #fff;
        }

        .btn-crimson:hover {
            background: var(--crimson-dk);
            transform: translateY(-1px);
        }

        /* ─────────────────────────────────────
           FOOTER
        ───────────────────────────────────── */
        footer {
            background: #d4d4d4;
            padding: 28px 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .footer-copy   { font-size: 0.82rem; color: var(--text-dark); }
        .footer-credit { font-size: 0.82rem; color: var(--text-dark); }

        .footer-social {
            display: flex;
            gap: 20px;
        }

        .footer-social a {
            color: var(--text-dark);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-social a:hover { color: var(--crimson); }

        /* ─────────────────────────────────────
           RESPONSIVE
        ───────────────────────────────────── */
        @media (max-width: 820px) {
            nav                { padding: 0 24px; }
            .slideshow-wrapper { padding: 0 50px; min-height: 340px; }
            .slide img         { height: 340px; }
            .contact           { padding: 60px 24px 80px; }
            .contact-inner     { flex-direction: column; align-items: flex-start; }
            footer             { padding: 24px; flex-direction: column; text-align: center; }
            .footer-social     { justify-content: center; }
        }

        @media (max-width: 500px) {
            .showcase-banner   { height: 200px; }
            .slideshow-wrapper { padding: 0 36px; min-height: 260px; }
            .slide img         { height: 260px; }
            .slide-arrow       { font-size: 1.8rem; padding: 8px 10px; }
        }

    </style>

    <!-- ── SLIDESHOW JAVASCRIPT ── -->
    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dots   = document.querySelectorAll('.dot');

        /* Move to a specific slide by index */
        function goToSlide(index) {
            // Remove active from current slide and dot
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');

            // Wrap around if we go past the ends
            currentSlide = (index + slides.length) % slides.length;

            // Activate the new slide and dot
            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
        }

        /* Move forward (+1) or backward (-1) */
        function changeSlide(direction) {
            goToSlide(currentSlide + direction);
        }

        /* Auto-advance every 5 seconds */
        setInterval(() => changeSlide(1), 5000);

        /* Keyboard arrow support */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft')  changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
        });
    </script>
